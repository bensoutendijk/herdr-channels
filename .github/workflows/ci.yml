# Every PR and every push to main runs the tests, on Linux and on macOS (the machine this runs on).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check bin/channels.mjs && node --check bin/harness/index.mjs && node --check bin/harness/claude.mjs && node --check bin/harness/codex.mjs && node --check bin/codex-rpc.mjs && node --check bin/schedule.mjs && node --check bin/routines.mjs && node --check install.mjs
      - run: node --test test/*.test.mjs
  # The chats' task cards mod (mods/claude): Claude Code's own checks of a plugin, run against the engine itself.
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.328
      - run: claude plugin validate mods/claude
      - run: claude plugin test mods/claude
